server.port=8080
spring.application.name=careercompass-backend

# Database Configuration (Defaults to in-memory H2 with MySQL compatibility, easily toggleable to MySQL)
spring.datasource.url=jdbc:h2:mem:careercompassdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Python FastAPI AI Service URL
ai.service.url=http://127.0.0.1:8000
